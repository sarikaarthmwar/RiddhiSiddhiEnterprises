<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PropertyIQ Usage Dashboard</title>
<style>:root{--ink:#171923;--muted:#687385;--line:#e7e8ed;--brand:#27156f;--orange:#ee8a16;--green:#16704f;--bg:#f8f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,sans-serif}.wrap{max-width:1160px;margin:auto;padding:28px 20px 50px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}.eyebrow{color:var(--brand);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}h1{font-size:32px;margin:5px 0 6px}p{margin:0;color:var(--muted);line-height:1.55}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}.controls button.active{background:var(--brand);border-color:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(25,20,60,.04)}.kpi b{display:block;font-size:30px;margin-top:6px;color:var(--brand)}.label{font-size:12px;color:var(--muted);font-weight:700}.panels{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.panel h2{font-size:16px;margin:0 0 14px}.list{display:grid;gap:11px}.row{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:12px;align-items:center}.bar{height:9px;border-radius:99px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--orange));border-radius:99px}.value{text-align:right;font-weight:800}.trend{display:flex;align-items:end;height:180px;gap:6px;padding-top:12px}.trend div{flex:1;min-width:6px;background:linear-gradient(180deg,var(--orange),var(--brand));border-radius:5px 5px 0 0;position:relative}.trend div:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:5px 7px;white-space:nowrap;border-radius:5px;font-size:11px}.recent{margin-top:16px}.activity{padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.status{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:760px){.wrap{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}header{flex-direction:column}h1{font-size:27px}}</style></head>
<body><main class="wrap"><header><div><div class="eyebrow">Riddhi Siddhi Enterprises</div><h1>PropertyIQ Usage</h1><p>Aggregate, anonymized product activity. No lead contact details are shown here.</p></div><div class="controls" aria-label="Date range"><button data-range="today">Today</button><button data-range="7d">7 days</button><button class="active" data-range="30d">30 days</button><button data-range="all">All time</button><button id="refresh">Refresh</button></div></header><section id="app"><div class="empty">Loading current usage…</div></section></main><script>
const app=document.querySelector('#app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let range='30d';
function list(items){if(!items?.length)return '<div class="empty">No activity in this period.</div>';const max=Math.max(...items.map(x=>x.value),1);return '<div class="list">'+items.map(x=>'<div class="row"><div><div class="label">'+esc(x.label)+'</div><div class="bar"><i style="width:'+(x.value/max*100)+'%"></i></div></div><div class="value">'+x.value+'</div></div>').join('')+'</div>'}
function render(d){const trend=d.trend||[],max=Math.max(...trend.map(x=>x.value),1);app.innerHTML='<section class="grid"><div class="card kpi"><span class="label">Total analyses</span><b>'+d.totalAnalyses+'</b></div><div class="card kpi"><span class="label">Average score</span><b>'+(d.averageScore??'—')+'</b></div><div class="card kpi"><span class="label">Leads generated</span><b>'+d.leadsGenerated+'</b></div><div class="card kpi"><span class="label">Conversion rate</span><b>'+d.conversionRate+'%</b></div></section><section class="panels"><div class="panel"><h2>PropertyIQ usage trend</h2>'+(trend.length?'<div class="trend">'+trend.map(x=>'<div style="height:'+Math.max(4,x.value/max*100)+'%" data-tip="'+esc(x.date)+': '+x.value+'"></div>').join('')+'</div>':'<div class="empty">No completed analyses yet.</div>')+'</div><div class="panel"><h2>Popular locations</h2>'+list(d.locations)+'</div><div class="panel"><h2>Property type</h2>'+list(d.propertyTypes)+'</div><div class="panel"><h2>Investment intent</h2>'+list(d.intents)+'</div><div class="panel"><h2>Score distribution</h2>'+list(d.scoreDistribution)+'</div><div class="panel"><h2>Recent activity</h2><div class="recent">'+(d.recent?.length?d.recent.map(x=>'<div class="activity"><b>'+esc(x.propertyType)+' · '+esc(x.location)+'</b><br><span class="label">'+(x.score==null?'Score pending':'Score '+x.score)+' · '+new Date(x.createdAt).toLocaleString()+'</span></div>').join(''):'<div class="empty">No completed analyses yet.</div>')+'</div></div></section><div class="status">Last refreshed '+new Date(d.generatedAt).toLocaleTimeString()+' · Metrics reflect the selected period.</div>'}
async function load(){app.innerHTML='<div class="empty">Loading current usage…</div>';try{const r=await fetch('/api/propertyiq-analytics?range='+range),d=await r.json();if(!r.ok)throw Error(d.error||'Could not load analytics.');render(d)}catch(e){app.innerHTML='<div class="empty">'+esc(e.message)+' Connect Upstash Redis in Vercel to enable analytics.</div>'}}document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelector('#refresh').onclick=load;load();
</script></body></html>
