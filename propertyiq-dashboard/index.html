<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PropertyIQ Usage Dashboard</title>
<style>:root{--ink:#171923;--muted:#687385;--line:#e7e8ed;--brand:#27156f;--orange:#ee8a16;--green:#16704f;--bg:#f8f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,sans-serif}.wrap{max-width:1160px;margin:auto;padding:28px 20px 50px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}.eyebrow{color:var(--brand);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}h1{font-size:32px;margin:5px 0 6px}p{margin:0;color:var(--muted);line-height:1.55}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}.controls button.active{background:var(--brand);border-color:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(25,20,60,.04)}.kpi b{display:block;font-size:30px;margin-top:6px;color:var(--brand)}.label{font-size:12px;color:var(--muted);font-weight:700}.panels{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.panel h2{font-size:16px;margin:0 0 14px}.list{display:grid;gap:11px}.row{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:12px;align-items:center}.bar{height:9px;border-radius:99px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--orange));border-radius:99px}.value{text-align:right;font-weight:800}.trend{display:flex;align-items:end;height:180px;gap:6px;padding-top:12px}.trend div{flex:1;min-width:6px;background:linear-gradient(180deg,var(--orange),var(--brand));border-radius:5px 5px 0 0;position:relative}.trend div:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:5px 7px;white-space:nowrap;border-radius:5px;font-size:11px}.recent{margin-top:16px}.activity{padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.status{font-size:12px;color:var(--muted);margin-top:12px}.analyses{margin-top:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.analysis-table{width:100%;border-collapse:collapse;min-width:1180px;background:#fff}.analysis-table th,.analysis-table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.analysis-table th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:#fafafe;position:sticky;top:0;z-index:1}.analysis-table tr:last-child td{border-bottom:0}.analysis-table td{font-size:13px}.analysis-table .score{font-weight:800;color:var(--brand)}.analysis-table .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}.response{max-width:420px;line-height:1.45}.response strong{display:block;color:var(--brand);margin-bottom:4px}.response .rate{font-size:12px;color:var(--muted);margin-top:5px}.response .evidence{font-size:11px;color:var(--muted);margin-top:4px}.response.error{color:#b43b3b;font-size:12px}.table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.table-head h2{margin:0}.table-count{font-size:12px;color:var(--muted);font-weight:700}.table-search{width:230px;max-width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;outline:none}.table-search:focus{border-color:var(--brand)}.response-note{font-size:11px;color:var(--muted);margin-top:4px}@media(max-width:760px){.wrap{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}header{flex-direction:column}h1{font-size:27px}.table-head{align-items:flex-start;flex-direction:column;width:100%}.table-search{width:100%}}
</style></head>
<body><main class="wrap"><header><div><div class="eyebrow">Riddhi Siddhi Enterprises</div><h1>PropertyIQ Usage</h1><p>Aggregate, anonymized product activity. Analysis responses are loaded from the stored PropertyIQ record.</p></div><div class="controls" aria-label="Date range"><button data-range="today">Today</button><button data-range="7d">7 days</button><button class="active" data-range="30d">30 days</button><button data-range="all">All time</button><button id="refresh">Refresh</button></div></header><section id="app"><div class="empty">Loading current usage…</div></section></main><script>
const app=document.querySelector('#app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let range='30d',currentAnalyses=[];
function list(items){if(!items?.length)return '<div class="empty">No activity in this period.</div>';const max=Math.max(...items.map(x=>x.value),1);return '<div class="list">'+items.map(x=>'<div class="row"><div><div class="label">'+esc(x.label)+'</div><div class="bar"><i style="width:'+(x.value/max*100)+'%"></i></div></div><div class="value">'+x.value+'</div></div>').join('')+'</div>'}
function responseCell(x){const r=x.response;if(!r?.fullAnalysisAvailable)return '<div class="response error">Full analysis not available for this record.</div>';return '<div class="response"><strong>'+esc(r.verdict||'Analysis complete')+'</strong><span>'+esc(r.recommendation||'No recommendation stored.')+'</span>'+(r.marketRatePerSqft?'<div class="rate">Evidence-based market rate: ₹'+Number(r.marketRatePerSqft).toLocaleString('en-IN')+'/sq.ft.</div>':'')+(r.lowRatePerSqft&&r.highRatePerSqft?'<div class="evidence">Evidence range: ₹'+Number(r.lowRatePerSqft).toLocaleString('en-IN')+' – ₹'+Number(r.highRatePerSqft).toLocaleString('en-IN')+'/sq.ft.</div>':'')+'<div class="response-note">Complete analysis + evidence stored against this Analysis ID.</div></div>'}
function renderTable(){const query=(document.querySelector('#analysis-search')?.value||'').trim().toLowerCase();const rows=currentAnalyses.filter(x=>[x.analysisId,x.propertyType,x.location,x.investmentIntent,x.response?.propertyName,x.response?.verdict].join(' ').toLowerCase().includes(query));const tableRows=rows.length?rows.map(x=>'<tr><td>'+new Date(x.createdAt).toLocaleString()+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.propertyType)+'</td><td>'+esc(x.investmentIntent)+'</td><td class="score">'+(x.score==null?'—':x.score)+'</td><td class="id">'+esc(x.analysisId)+'</td><td>'+responseCell(x)+'</td></tr>').join(''):'<tr><td colspan="7"><div class="empty">No analyses match your search.</div></td></tr>';const countText=query?rows.length+' of '+currentAnalyses.length+' analyses':currentAnalyses.length+' analyses';const container=document.querySelector('#analysis-table-container');if(container)container.innerHTML='<div class="table-head"><div><h2>All analyses + response</h2><div class="table-count">'+countText+' in selected period</div></div><input id="analysis-search" class="table-search" type="search" placeholder="Search location, type, intent…" value="'+esc(query)+'"></div><div class="table-wrap"><table class="analysis-table"><thead><tr><th>Date & time</th><th>Location</th><th>Property type</th><th>Investment intent</th><th>Score</th><th>Analysis ID</th><th>Response</th></tr></thead><tbody>'+tableRows+'</tbody></table></div>';document.querySelector('#analysis-search')?.addEventListener('input',renderTable)}
function render(d){currentAnalyses=d.analyses||[];app.innerHTML='<section class="grid"><div class="card kpi"><span class="label">Total analyses</span><b>'+d.totalAnalyses+'</b></div><div class="card kpi"><span class="label">Average score</span><b>'+(d.averageScore??'—')+'</b></div><div class="card kpi"><span class="label">Leads generated</span><b>'+d.leadsGenerated+'</b></div><div class="card kpi"><span class="label">Conversion rate</span><b>'+d.conversionRate+'%</b></div></section><section class="panels"><div class="panel"><h2>PropertyIQ usage trend</h2>'+((d.trend||[]).length?'<div class="trend">'+d.trend.map(x=>'<div style="height:'+Math.max(4,x.value/Math.max(...d.trend.map(t=>t.value),1)*100)+'%" data-tip="'+esc(x.date)+': '+x.value+'"></div>').join('')+'</div>':'<div class="empty">No completed analyses yet.</div>')+'</div><div class="panel"><h2>Popular locations</h2>'+list(d.locations)+'</div><div class="panel"><h2>Property type</h2>'+list(d.propertyTypes)+'</div><div class="panel"><h2>Investment intent</h2>'+list(d.intents)+'</div><div class="panel"><h2>Score distribution</h2>'+list(d.scoreDistribution)+'</div><div class="panel"><h2>Recent activity</h2><div class="recent">'+(d.recent?.length?d.recent.map(x=>'<div class="activity"><b>'+esc(x.propertyType)+' · '+esc(x.location)+'</b><br><span class="label">'+(x.score==null?'Score pending':'Score '+x.score)+' · '+new Date(x.createdAt).toLocaleString()+'</span></div>').join(''):'<div class="empty">No completed analyses yet.</div>')+'</div></div></section><section class="panel analyses" id="analysis-table-container"></section><div class="status">Last refreshed '+new Date(d.generatedAt).toLocaleTimeString()+' · Metrics reflect the selected period.</div>';renderTable()}
async function load(){app.innerHTML='<div class="empty">Loading current usage…</div>';try{const r=await fetch('/api/propertyiq-analytics?range='+range),d=await r.json();if(!r.ok)throw Error(d.error||'Could not load analytics.');render(d)}catch(e){app.innerHTML='<div class="empty">'+esc(e.message)+' Connect Upstash Redis in Vercel to enable analytics.</div>'}}document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelector('#refresh').onclick=load;load();
</script></body></html>
